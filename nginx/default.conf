server {
    listen 80;
    server_name _;

    # Route Webhook 1 to Bot 1
    location /webhook/main {
        proxy_pass http://bot1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route Webhook 2 to Bot 2 (@opendvn2_bot)
    location /webhook/bot2 {
        proxy_pass http://bot2:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health Check endpoints
    location /health1 {
        proxy_pass http://bot1:8000/health;
    }

    location /health2 {
        proxy_pass http://bot2:8000/health;
    }

    # Default fallback
    location / {
        proxy_pass http://bot1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
